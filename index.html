const nav=[['dashboard','Ana Ekran'],['orders','Siparişler'],['work','İş Emirleri'],['machines','Makineler'],['operator','Operatör'],['shipping','Sevkiyat'],['history','Hareketler']];function go(p){page=p;detailTab='general';filter='';render();window.scrollTo(0,0)}function openJob(id){selectedJob=id;page='detail';detailTab='general';render();window.scrollTo(0,0)}function shell(){const title={dashboard:'Üretim Durumu',orders:'Sipariş Listesi',work:'İş Emirleri',machines:'Makineler',operator:'Operatör Paneli',shipping:'Sevkiyat',history:'Üretim Hareketleri',detail:'İş Emri Detayı'}[page];return `<div class="shell"><aside class="sidebar"><div class="brand"><div class="logo">R</div><div>Ritim Flow <small>LITE</small></div></div>${nav.map(([id,t])=>`<button class="nav ${page===id||page==='detail'&&id==='work'?'active':''}" onclick="go('${id}')"><span class="nav-ico">${icons[id]}</span>${t}</button>`).join('')}<div class="sidebar-footer">Kâğıtsız üretim takibi<br>3 CNC makinesi · Demo sürümü</div></aside><main class="main"><header class="top"><div><h1>${title}<span class="demo-badge">Satış Demo</span></h1><div class="sub">Mazak · Mitsubishi · DMG MORI</div></div><div class="user-area"><span class="small muted">Aktif kullanıcı</span><select class="field" onchange="setUser(this.value)">${['Mehmet','Ali','Hasan','Yönetici'].map(u=>`<option ${state.user===u?'selected':''}>${u}</option>`).join('')}</select><div class="avatar">${state.user[0]}</div></div></header><div id="content"></div></main></div><nav class="mobile-nav">${[['dashboard','Genel'],['orders','Sipariş'],['work','İşler'],['operator','Üretim'],['shipping','Sevkiyat']].map(([id,t])=>`<button class="${page===id||page==='detail'&&id==='work'?'selected':''}" onclick="go('${id}')"><b>${icons[id]}</b>${t}</button>`).join('')}</nav><div id="modalhost"></div>`}function setUser(u){state.user=u;save();render()}function render(){document.getElementById('app').innerHTML=shell();$('#content').innerHTML='<div class="page-enter"> function stats(){return `<div class="grid stats"><div class="card stat"><span class="small">Toplam İş Emri</span><strong>${state.jobs.length}</strong><div class="tiny muted">Sistemde kayıtlı</div></div><div class="card stat"><span class="small">Üretimde</span><strong>${state.jobs.filter(j=>j.state==='running').length}</strong><div class="tiny" style="color:var(--green)">Aktif</div></div><div class="card stat"><span class="small">Bekleyen / Duraklayan</span><strong>${state.jobs.filter(j=>['waiting','paused'].includes(j.state)).length}</strong><div class="tiny muted">İşlem bekliyor</div></div><div class="card stat"><span class="small">Sevke Hazır</span><strong>${state.jobs.filter(j=>j.state==='complete').length}</strong><div class="tiny muted">Üretimi tamamlanan</div></div></div>`}function getMachineJob(id){return state.jobs.find(j=>j.machine===id&&j.state==='running')||state.jobs.find(j=>j.machine===id&&j.state==='paused')||state.jobs.find(j=>j.machine===id&&j.state==='waiting')};function machineCard(m){let j=getMachineJob(m.id);return `<div class="card machine"><div class="machine-top">${machineSVG(m.brand)}${j?badge(j.state):'<span class="badge gray">Boş</span>'}</div><div class="machine-body"><div class="machine-name">${m.id}</div><div class="machine-model">${m.brand}</div>${j?`<div class="jobtag"><div class="bold">${esc(j.part)}</div><div class="tiny muted">${esc(j.id)} · ${esc(j.customer)}</div></div>${progress(j)}<div class="row tiny muted" style="margin:14px 0"><span>Operatör: ${esc(state.events.find(e=>e.job===j.id)?.user||'—')}</span><span>Hurda: ${j.scrap}</span></div><button class="btn primary full" onclick="selectMachine('${m.id}');go('operator')">İşi Aç →</button>`:`<div class="jobtag muted">Atanmış iş bulunmuyor</div><button class="btn full" onclick="go('work')">İş Ata</button>`}</div></div>`};function dashboard(){return `${stats()}<div class="section-head"><h2>Makineler (3)</h2><button class="link" onclick="go('machines')">Tüm makineler →</button></div><div class="grid machines">${machines.map(machineCard).join('')}</div><div class="section-head"><h2>Son İşlemler</h2><button class="link" onclick="go('history')">Tümünü Gör</button></div><div class="card pad">${historyRows(state.events.slice(0,4))}</div>`}function machinesPage(){return `<div class="section-head"><h2>3 CNC Makinesi</h2></div><div class="grid machines">${machines.map(machineCard).join('')}</div>`}function work(){return `${toolbar('İş Emri')}`}function orders(){return `${toolbar('Sipariş')}`}function searchFilter(j){let q=filter.toLocaleLowerCase('tr');return !q||[j.id,j.customer,j.part,j.partNo,j.po,j.machine,j.state].some(x=>String(x||'').toLocaleLowerCase('tr').includes(q))}function setFilter(v){filter=v;let el=$('#jobTable');if(el)el.innerHTML=jobsTable(state.jobs.filter(searchFilter),page==='orders')}function toolbar(label){return `<div class="toolbar"><input class="field" placeholder="İş emri, müşteri, parça veya sipariş ara..." value="${esc(filter)}" oninput="setFilter(this.value)"/><button class="btn primary" onclick="openModal('newJob')">+ Yeni ${label}</button><button class="btn" onclick="exportCSV()">⇩ CSV</button></div><div id="jobTable" class="card table-wrap">`+jobsTable(state.jobs.filter(searchFilter),page==='orders')+'</div>'}function jobsTable(js,orderMode=false){let cards=js.map(j=>`<button type="button" class="mobile-job-card" onclick="openJob('${esc(j.id)}')"><div class="mjc-top"><div class="mjc-identity"><span class="mjc-id">${esc(j.id)}</span><span class="mjc-customer">${esc(j.customer)}</span></div>${badge(j.state)}</div><div class="mjc-name">${esc(j.part)}</div><div class="mjc-po">Sipariş: ${esc(j.po||'—')}</div><div class="mjc-progress"><span>Üretilen <strong>${j.good} / ${j.target}</strong></span><strong>%${j.target?Math.round(100*j.good/j.target):0}</strong></div><div class="progress"><div class="bar" style="width:${j.target?Math.min(100,j.good/j.target*100):0}%"></div></div><div class="mjc-bottom"><div><small>Makine</small> )],['Parça no',j.partNo||'—'],['İş emri tarihi',moneyDate(j.date)],['Teslim tarihi',moneyDate(j.due)],['Sipariş adedi',j.target],['Revizyon',j.revision||'—'],['Malzeme',j.material||'—'],['Malzeme ölçüleri',j.dimensions||'—'],['Doküman no',j.docNo||'—'],['Yayın tarihi',j.docDate||'—']].map(([a,b])=>`<div><div class="info-label">${a}</div><div class="info-value">${esc(b)}</div></div>`).join('')}</div><div class="section-head"><h2>Makine Ataması</h2></div><select class="field wide" onchange="assignJob('${j.id}',this.value)"><option value="">Atanmadı</option>${machines.map(m=>`<option value="${m.id}" ${j.machine===m.id?'selected':''}>${m.id} — ${m.brand}</option>`).join('')}</select><div class="section-head"><h2>Üretim İlerlemesi</h2></div>${progress(j)}<div class="grid qty-boxes"><div class="qty-box"><div class="tiny">Sağlam</div><strong>${j.good}</strong></div><div class="qty-box scrap"><div class="tiny">Hurda</div><strong>${j.scrap}</strong></div><div class="qty-box remaining"><div class="tiny">Kalan</div><strong>${Math.max(0,j.target-j.good)}</strong></div></div><p><button class="btn primary" onclick="selectMachine('${j.machine||'CNC-01'}');go('operator')">Operatör Ekranına Git</button></p></div><div class="card pad"><h3 style="margin-top:0">Teknik Resim</h3><div class="tech" onclick="openModal('drawing')">${j.drawing?`<img src="${j.drawing}" alt="Yüklenen teknik resim"/>`:drawing()}<div class="hint">Büyütmek için dokunun</div></div><div class="actions" style="margin-top:13px"><label class="btn sm" style="cursor:pointer">📎 Teknik Resim Yükle<input type="file" accept="image/png,image/jpeg,image/webp,application/pdf" style="display:none" onchange="uploadDrawing(event)"></label>${j.drawing?'<button class="btn sm danger" onclick="removeDrawing()">Kaldır</button>':''}</div><p class="hint">JPG/PNG/WebP ve PDF (PDF dosyaları ayrı sekmede açılır). Yükleme demo amaçlıdır.</p><h3>Notlar</h3><textarea class="field wide" rows="3" id="notes" placeholder="Operasyon veya iş emri notu...">${esc(j.notes||'')}</textarea><button class="btn sm" style="margin-top:8px" onclick="jNotes()">Notu Kaydet</button></div></div>`:detailTab==='operations'?`<div class="card pad"><h3>Sipariş Operasyon Rotası</h3><p class="muted small">Operasyonlar sipariş oluşturulurken seçilir ve sıralanır. İş emri sipariş rotasını uygular. Sevkiyat ayrı yönetilir.</p><div class="op-list">${routeFor(j).map((op,i)=>`<div class="op-row"><div class="row"><div class="op-n">${i+1}</div><div><b>${esc(op)}</b><div class="tiny muted">${i===j.op?'Aktif operasyon':i<j.op?'Geçilen aşama':'Bekliyor'}</div></div></div><div class="actions">${i===j.op?'<span class="badge blue">Aktif</span>':i<j.op?'<span class="badge green">Tamamlandı</span>':'<span class="badge gray">Bekliyor</span>'}${i===j.op&&i<routeFor(j).length-1?`<button class="btn sm" onclick="nextOperation('${j.id}')">Sonraki Aşama →</button>`:''}</div></div>`).join('')}</div></div>`:`<div class="card pad"><h3>${esc(j.id)} — Hareket Geçmişi</h3>${historyRows(state.events.filter(e=>e.job===j.id))}</div>`}`};function jNotes(){job(selectedJob).notes=$('#notes').value;save();toast('Not kaydedildi')};function assignJob(id,m){let j=job(id);j.machine=m;save();toast('Makine ataması güncellendi');render()}function nextOperation(id){let j=job(id);if(j.op<routeFor(j).length-1){j.op++;save();render();toast('Operasyon ilerletildi')}}
function selectMachine(id){selectedMachine=id}function operator(){let m=machines.find(x=>x.id===selectedMachine)||machines[0],j=getMachineJob(m.id);return `<div class="op-app"><div class="op-machine-line"><label for="opMachine">MAKİNE</label><select id="opMachine" class="field" onchange="selectedMachine=this.value;render()">${machines.map(k=>`<option value="${k.id}" ${m.id===k.id?'selected':''}>${k.id} · ${k.brand}</option>`).join('')}</select>${j?badge(j.state):'<span class="badge gray">Boş</span>'}</div>${j?`<section class="op-summary"><div class="op-title-row"><div class="op-title-wrap"><h2>${esc(j.part)}</h2><div class="op-meta">${esc(j.id)} · ${esc(j.customer)}</div><div class="op-meta">${esc(routeFor(j)[j.op]||'İmalat')}</div></div><button class="op-drawing" aria-label="Teknik resmi aç" onclick="openJob('${j.id}')">▧ <span>Çizim</span></button></div><div class="op-meter"><strong>${j.good} <span>/ ${j.target}</span></strong><b>%${j.target?Math.round(j.good/j.target*100):0}</b></div><div class="op-progress"><div style="width:${j.target?Math.min(100,j.good/j.target*100):0}%"></div></div><div class="op-totals"><span>Sağlam <b>${j.good}</b></span><span>Hurda <b class="op-red">${j.scrap}</b></span><span>Kalan <b>${Math.max(0,j.target-j.good)}</b></span></div></section><section class="op-entry"><div class="op-segments"><button class="${qtyType==='production'?'active good':''}" onclick="qtyType='production';render()">✓ Sağlam</button><button class="${qtyType==='scrap'?'active bad':''}" onclick="qtyType='scrap';render()">✕ Hurda</button></div><div class="op-quantity"><button aria-label="Miktarı azalt" onclick="adjustQty(-1)">−</button><input aria-label="Adet" type="number" id="qty" inputmode="numeric" min="1" step="1" value="1"><button aria-label="Miktarı artır" onclick="adjustQty(1)">+</button></div><button class="op-save" onclick="addQty('${j.id}')" ${j.state!=='running'?'disabled':''}>${qtyType==='production'?'Üretimi Kaydet':'Hurdayı Kaydet'}</button></section><div class="op-footer-actions">${j.state==='waiting'?`<button class="op-pause" onclick="changeStatus('${j.id}','running')">▶ Başlat</button>`:j.state==='paused'?`<button class="op-pause" onclick="changeStatus('${j.id}','running')">▶ Devam</button>`:j.state==='running'?`<button class="op-pause" onclick="changeStatus('${j.id}','paused')">Ⅱ Duraklat</button>`:`<button disabled class="op-pause">Tamamlandı</button>`}<button class="op-finish" onclick="finishJob('${j.id}')" ${!['running','paused'].includes(j.state)?'disabled':''}>✓ İşi Bitir</button></div><button class="op-history" onclick="go('history')">İşlem geçmişini görüntüle →</button>`:`<div class="empty">Bu makinede atanmış iş yok.<p><button class="btn primary" onclick="go('work')">İş Emri Ata</button></p></div>`}</div>`}function adjustQty(n){let q=$('#qty');q.value=Math.max(1,Number(q.value||1)+n)}function logEvent(j,type,qty=0){state.events.unshift({job:j.id,type,qty,user:state.user,machine:j.machine,time:new Date().toISOString()})}function changeStatus(id,s){let j=job(id);if(j.state==='shipped'||j.state==='complete')return;j.state=s;logEvent(j,s==='running'?'start':'pause');save();render();toast(s==='running'?'İş başlatıldı / devam ediyor':'İş duraklatıldı')}function addQty(id){let j=job(id),num=Number($('#qty')?.value);if(!Number.isInteger(num)||num<=0)return toast('Pozitif tam sayı girin');if(j.state!=='running')return toast('Önce işi başlatın');if(qtyType==='production'){if(j.good+num>j.target)return toast('Üretim miktarı hedefi aşıyor');j.good+=num}else j.scrap+=num;logEvent(j,qtyType,num);save();render();toast(`${num} adet ${qtyType==='production'?'sağlam üretim':'hurda'} kaydedildi`)}function finishJob(id){let j=job(id);if(!confirm(`${j.id} iş emrini üretim tamamlandı olarak işaretlemek istiyor musunuz?\nSağlam üretim: ${j.good}/${j.target}`))return;j.state='complete';logEvent(j,'finish');save();render();toast('İş tamamlandı, sevkiyata aktarıldı')}function historyRows(events){return events.length?events.map(e=>`<div class="history-row"><div class="history-icon ${e.type==='scrap'?'scrap':''}">${({production:'✓',scrap:'✕',start:'▶',pause:'Ⅱ',finish:'✓',shipment:'⇥'})[e.type]||'•'}</div><div style="flex:1;min-width:0"><b>${({production:'Sağlam Üretim',scrap:'Hurda',start:'İş Başladı / Devam',pause:'İş Duraklatıldı',finish:'İş Tamamlandı',shipment:'Sevkiyat'})[e.type]||e.type}</b><div class="tiny muted">${esc(e.job)} · ${esc(e.machine||'—')} · ${esc(e.user)}</div></div><div style="text-align:right"><b>${e.qty?'+'+e.qty+' adet':'—'}</b><div class="tiny muted">${stamp(e.time)}</div></div></div>`).join(''):'<div class="empty">Henüz hareket kaydı yok.</div>'}function history(){return `<div class="card pad"><div class="section-head" style="margin-top:0"><h2>Tüm İşlem Geçmişi</h2></div>${historyRows(state.events)}</div>`}function shipping(){let list=state.jobs.filter(j=>j.state==='complete'),done=state.jobs.filter(j=>j.state==='shipped');return `<div class="section-head"><h2>Sevke Hazır İşler (${list.length})</h2></div><div class="card pad">${list.length?list.map(j=>`<div class="op-row" style="margin-bottom:10px"><div><b>${esc(j.part)}</b> · ${esc(j.id)}<div class="tiny muted">${esc(j.customer)} · ${j.good}/${j.target} adet</div></div><button class="btn primary sm" onclick="openShipment('${j.id}')">Sevk Et</button></div>`).join(''):'<div class="empty">Sevke hazır iş bulunmuyor. Operatör iş emrini tamamladığında burada görünür.</div>'}</div><div class="section-head"><h2>Sevkiyat Geçmişi</h2></div><div class="card pad">${state.shipments.length?state.shipments.map(s=>`<div class="history-row"><b>${esc(s.job)}</b><span>${s.qty} adet</span><span class="muted">${stamp(s.time)} · ${esc(s.user)}</span></div>`).join(''):'<div class="empty">Henüz sevkiyat kaydı yok.</div>'}</div><div class="hint">Kısmi sevkiyatlar da kaydedilir. Sevk miktarı toplam sağlam üretimi geçemez.</div>`}function openShipment(id){selectedJob=id;openModal('shipment')}
function openModal(type){modal=type;showModal(type)}function closeModal(){modal='';$('#modalhost').innerHTML=''}function showModal(type){let j=job(selectedJob);let html=type==='newJob'?`<h2>Yeni Sipariş ve İlk İş Emri</h2><p class="hint">Önce sipariş bilgilerini ve operasyon rotasını seçin. Ardından bu sipariş için ilk iş emri açılır.</p><form id="newForm" onsubmit="createJob(event)"><div class="form-grid">${[['id','İş Emri No','MKY0021'],['customer','Müşteri',''],['part','Parça Adı',''],['partNo','Parça Numarası',''],['po','Sipariş Numarası',''],['target','Sipariş Adedi','1'],['date','İş Emri Tarihi','2026-10-14'],['due','Teslim Tarihi','2026-10-30'],['revision','Revizyon','A'],['material','Malzeme',''],['dimensions','Malzeme Ölçüleri','']].map(([id,t,v])=>`<div class="form-row"><label>${t}</label><input name="${id}" class="field" ${id==='target'?'type="number" min="1"':id==='date'||id==='due'?'type="date"':''} value="${esc(v)}" ${['id','part','target'].includes(id)?'required':''}></div>`).join('')}${routePicker()}<div class="form-row"><label>Makine</label><select class="field" name="machine"><option value="">Atanmadı</option>${machines.map(m=>`<option value="${m.id}">${m.id} — ${m.brand}</option>`).join('')}</select></div></div><div class="actions" style="margin-top:20px;justify-content:end"><button type="button" class="btn" onclick="closeModal()">İptal</button><button class="btn primary">Siparişi ve İş Emrini Oluştur</button></div></form>`:type==='editJob'?`<h2>${esc(j.id)} — Düzenle</h2><div class="form-row"><label>Teslim Tarihi</label><input id="editDue" type="date" class="field" value="${j.due||''}"></div><div class="form-row" style="margin-top:12px"><label>Revizyon</label><input id="editRev" class="field" value="${esc(j.revision||'')}"></div><div class="actions" style="margin-top:16px"><button class="btn primary" onclick="saveEdit()">Kaydet</button><button class="btn" onclick="closeModal()">İptal</button></div>`:type==='drawing'?`<h2>Teknik Resim — ${esc(j.id)}</h2><div class="tech" style="cursor:default;min-height:350px">${j.drawing?j.drawing.startsWith('data:application/pdf')?`<iframe title="PDF Teknik Resim" src="${j.drawing}" style="width:100%;height:65vh;border:0"></iframe>`:`<img src="${j.drawing}" alt="Teknik resim" style="max-height:65vh">`:drawing()}</div><p class="hint">${j.drawing?'Yüklenen teknik resim görüntüleniyor.':'Bu yalnızca örnek çizimdir; gerçek resmi iş emrinden yükleyin.'}</p><button class="btn full" onclick="closeModal()">Kapat</button>`:type==='shipment'?`<h2>Sevkiyat Oluştur</h2><p>${esc(j.id)} · ${esc(j.part)}</p><p class="muted">Sağlam: ${j.good} adet · Daha önce sevk edilen: ${state.shipments.filter(s=>s.job===j.id).reduce((v,s)=>v+s.qty,0)} adet</p><div class="form-row"><label>Sevk Edilecek Adet</label><input type="number" min="1" id="shipQty" class="field" value="${Math.max(0,j.good-state.shipments.filter(s=>s.job===j.id).reduce((v,s)=>v+s.qty,0))}"></div><div class="actions" style="margin-top:15px"><button class="btn primary" onclick="ship()">Sevkiyatı Kaydet</button><button class="btn" onclick="closeModal()">İptal</button></div>`:'';$('#modalhost').innerHTML=`<div class="modal-wrap" onclick="if(event.target===this)closeModal()"><div class="modal">${html}</div></div>`;if(type==='newJob')addRouteRow('İmalat')}function saveEdit(){let j=job(selectedJob);j.due=$('#editDue').value;j.revision=$('#editRev').value;save();closeModal();render();toast('İş emri güncellendi')}function createJob(e){e.preventDefault();let o=Object.fromEntries(new FormData(e.target));if(job(o.id))return toast('Bu iş emri numarası mevcut');let route=pickedRoute();if(!route.length)return toast('Sipariş için en az bir operasyon seçin');if(!o.po?.trim())return toast('Sipariş numarası gereklidir');if(state.orderRoutes[o.po])return toast('Bu sipariş zaten mevcut. Operasyon rotası sipariş düzeyinde tanımlanmıştır');state.orderRoutes[o.po]=route;let j={...o,target:Number(o.target),good:0,scrap:0,state:'waiting',op:0,notes:'',drawing:''};state.jobs.unshift(j);save();closeModal();openJob(j.id);toast('Sipariş rotası ve ilk iş emri oluşturuldu')}function ship(){let j=job(selectedJob),n=Number($('#shipQty').value),sent=state.shipments.filter(s=>s.job===j.id).reduce((v,s)=>v+s.qty,0);if(!Number.isInteger(n)||n<1||n>j.good-sent)return toast('Geçerli sevk miktarı girin');state.shipments.unshift({job:j.id,qty:n,user:state.user,time:new Date().toISOString()});logEvent(j,'shipment',n);if(sent+n===j.good)j.state='shipped';save();closeModal();render();toast('Sevkiyat kaydedildi')};function uploadDrawing(e){let f=e.target.files[0];if(!f)return;if(f.size>2300000)return toast('Demo için en fazla 2,3 MB dosya yükleyin');let r=new FileReader();r.onload=()=>{job(selectedJob).drawing=r.result;try{save()}catch(e){return toast('Tarayıcı depolama alanı dolu; daha küçük dosya kullanın')}render();toast('Teknik resim eklendi')};r.readAsDataURL(f)}function removeDrawing(){job(selectedJob).drawing='';save();render();toast('Teknik resim kaldırıldı')}function bindRipples(){document.querySelectorAll('.btn,.nav,.mobile-nav button,.machine-tab,.mobile-job-card,.choice,.seg').forEach(el=>{if(el.dataset.rippleBound)return;el.dataset.rippleBound='1';el.addEventListener('click',function(e){const r=document.createElement('span');r.className='ripple';const rect=this.getBoundingClientRect();const size=Math.max(rect.width,rect.height);r.style.width=r.style.height=size+'px';r.style.left=(e.clientX-rect.left-size/2)+'px';r.style.top=(e.clientY-rect.top-size/2)+'px';this.appendChild(r);setTimeout(()=>r.remove(),560)})})}function exportCSV(){let rows=[['İş Emri','Firma','Parça','Parça No','Sipariş No','Termin','Hedef','Üretim','Hurda','Makine','Durum'],...state.jobs.map(j=>[j.id,j.customer,j.part,j.partNo,j.po,j.due,j.target,j.good,j.scrap,j.machine,labels[j.state]])];let csv='\ufeff'+rows.map(r=>r.map(v=>'"'+String(v||'').replace(/"/g,'""')+'"').join(';')).join('\r\n');let a=document.createElement('a');a.href=URL.createObjectURL(new Blob([csv],{type:'text/csv;charset=utf-8'}));a.download='ritim-flow-is-emirleri.csv';a.click();URL.revokeObjectURL(a.href)}render();
</script></body></html>
