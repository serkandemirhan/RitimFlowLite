const sampleStageStocks={
 'DEMO-SIP-001':{'İmalat':100,'Tesviye':80,'Kaplama':50,'Sevk Edildi':20},
 'DEMO-SIP-002':{'İmalat':120,'Tesviye':80},

function stageDistribution(o){
 const snap=sampleStageStocks[o.id]; const target=Math.max(0,Number(o.qty)||0);
 if(!snap)return target?[{name:'Bekliyor',qty:target}]:[];
 const entries=Object.entries(snap).filter(([name,qty])=>Number(qty)>0).map(([name,qty])=>({name:name==='Tamamlandı'?'Sevk Edildi':name,qty:Number(qty)}));
 const sum=entries.reduce((n,b)=>n+b.qty,0);
 if(sum<target)entries.unshift({name:'Bekliyor',qty:target-sum});
 if(sum>target)return [{name:'Kontrol Gerekli',qty:target}];
 return entries;
}
const stageColors={'Bekliyor':'#94a3b8','İmalat':'#64748b','Tesviye':'#3b82f6','Kaplama':'#8b5cf6','Montaj':'#14b8a6','Paketleme':'#eab308','Sevke Hazır':'#f59e0b','Sevk Edildi':'#16a34a','Kontrol Gerekli':'#ef4444'};

 if(ord){target.innerHTML=`<div class="order-list-v4">${data.map(o=>{const p=shipmentSummary(o);const status=p.percent===100?'Tamamlandı':p.shipped>0?'Kısmi Sevk':p.buckets.some(b=>b.name==='Bekliyor'&&b.qty===Number(o.qty))?'Bekliyor':'Üretimde';return `<button type="button" class="order-card-v4" onclick="openOrder('${esc(o.id)}')"><div class="oc-heading"><div class="oc-head-copy"><div class="oc-number">SİPARİŞ ${esc(o.id)}</div><div class="oc-name">${esc(o.part)}</div><div class="oc-customer">${esc(o.customer)} · Parça ${esc(o.partNo||'—')}</div></div><span class="oc-status ${p.percent===100?'complete':p.shipped>0?'part':status==='Bekliyor'?'wait':''}">${status}</span></div>${stageSummary(o)}<div class="oc-footer"><span>Termin: <strong>${date(o.due)}</strong></span><span>${Math.max(0,Number(o.qty)-p.shipped)} adet sevk bekliyor ›</span></div></button>`}).join('')||'<div class="empty">Eşleşen sipariş bulunamadı.</div>'}</div>`;return;}
 target.innerHTML=`<div class="list">${data.map(j=>{let o=jo(j);return `<button class="list-card" onclick="openJob('${esc(j.id)}')"><div class="list-top"><span class="list-id">İŞ EMRİ ${esc(j.id)}</span>${badge(j.state)}</div><div class="list-title">${esc(o.part)}</div><div class="list-sub">${esc(o.customer)} · Parça ${esc(o.partNo||'—')}</div><div class="pillrow"><span class="pill">${esc(j.machine||'Atanmadı')}</span><span class="pill">${esc(o.route[j.op]||'İmalat')}</span></div><div class="list-bottom"><span>Üretim: <b>${j.good} / ${o.qty} adet</b></span><span>İlerleme: <b>%${pct(j.good,o.qty)}</b> ›</span></div>${prog(j.good,o.qty)}</button>`}).join('')||'<div class="empty">Eşleşen iş emri bulunamadı.</div>'}</div>`;
}
function field(label,value){return `<div class="kv"><span>${label}</span><b>${esc(value||'—')}</b></div>`}
function drawingPreview(o){let pdf=o.drawing||'teknikResim.pdf';return `<div class="drawing" role="button" tabindex="0" onclick="showDrawing('${esc(o.id)}')"><div style="text-align:center;color:#3762b2">${I('file',40)}<br><b>Teknik Resim · PDF</b><br><small>Dokunarak aç / yakınlaştır</small></div></div>`}
function drawingBlock(o){return `<div class="card pad"><div class="row" style="margin-bottom:12px"><b>Teknik Resim</b><button class="btn sm" onclick="showDrawing('${esc(o.id)}')">${I('image',15)} Tam Ekran</button></div>${drawingPreview(o)}<label class="upload" style="margin-top:10px">${I('plus',16)} Teknik resim ekle (PDF / JPG / PNG)<input type="file" accept="application/pdf,image/png,image/jpeg,image/webp" onchange="uploadDrawing(event,'${esc(o.id)}')"></label><div class="tiny" style="margin-top:8px">Demo dosyaları yalnızca bu tarayıcıda tutulur (2 MB sınırı).</div></div>`}
function detailTabs(){return `<div class="tabs">${[['info','Genel'],['route','Operasyonlar'],['logs','Hareketler']].map(([v,t])=>`<button class="tab ${detailTab===v?'active':''}" onclick="detailTab='${v}';render()">${t}</button>`).join('')}</div>`}
function orderDetail(){let o=order(chosenJob);if(!o)return'<div class="empty">Sipariş bulunamadı.</div>';let js=state.jobs.filter(j=>j.order===o.id);return `<button class="btn sm" onclick="go('orders')">← Siparişler</button><div class="section"><div><h2>${esc(o.part)}</h2><div class="tiny">${esc(o.id)} · ${esc(o.customer)}</div></div><button class="btn primary sm" onclick="newJobFor('${esc(o.id)}')">${I('plus',15)} İş Emri</button></div><div class="detail-grid"><div class="card pad"><div class="kv-grid">${field('Sipariş No',o.id)}${field('Firma',o.customer)}${field('Parça No',o.partNo)}${field('Revizyon',o.revision)}${field('Miktar',o.qty+' adet')}${field('Teslim Tarihi',date(o.due))}${field('Malzeme',o.material)}${field('Ölçüler',o.dimensions)}</div><div class="section"><h2>Operasyon Rotası</h2><span class="tiny">Sipariş düzeyinde tanımlı</span></div>${o.route.map((r,i)=>`<div class="operation"><div class="op-number">${i+1}</div><div class="op-info"><b>${esc(r)}</b><span>${i===0?'İlk operasyon':'Önceki operasyonun ardından'}</span></div>${I('check',17)}</div>`).join('')}<div class="section"><h2>Bağlı İş Emirleri (${js.length})</h2></div>${js.map(j=>`<button class="list-card" onclick="openJob('${esc(j.id)}')"><div class="row"><b>${esc(j.id)} · ${esc(j.machine||'Atanmadı')}</b>${badge(j.state)}</div><div class="tiny">${j.good}/${o.qty} üretim · ${j.scrap} hurda</div></button>`).join('')}</div>${drawingBlock(o)}</div>`}
function jobDetail(){let j=job(chosenJob),o=j&&jo(j);if(!j)return'<div class="empty">İş bulunamadı.</div>';return `<button class="btn sm" onclick="go('jobs')">← İş Emirleri</button><div class="section"><div><h2>${esc(j.id)} · ${esc(o.part)}</h2><span class="tiny">${esc(o.customer)} · ${esc(o.id)}</span></div>${badge(j.state)}</div>${detailTabs()}${detailTab==='info'?`<div class="detail-grid"><div class="card pad"><div class="kv-grid">${field('İş Emri No',j.id)}${field('Sipariş No',o.id)}${field('Firma',o.customer)}${field('Parça / Revizyon',o.partNo+' / '+o.revision)}${field('Sipariş Tarihi',date(o.created))}${field('Termin',date(o.due))}${field('Malzeme',o.material)}${field('Ölçüler',o.dimensions)}</div><div class="section"><h2>Makine Ataması</h2></div><select class="select" aria-label="Makine seçimi" onchange="assignMachine('${esc(j.id)}',this.value)"><option value="">Atanmamış</option>${MACHINES.map(m=>`<option value="${m.id}" ${j.machine===m.id?'selected':''}>${m.id} · ${m.brand}</option>`).join('')}</select><div class="section"><h2>Üretim İlerlemesi</h2><b>%${pct(j.good,o.qty)}</b></div><div class="row"><b>${j.good} / ${o.qty} sağlam</b><span class="muted">${j.scrap} hurda</span></div>${prog(j.good,o.qty)}<button class="btn primary full" style="margin-top:14px" onclick="machine='${j.machine||'CNC-01'}';go('production')">${I('production',17)} Operatör Ekranı</button></div>${drawingBlock(o)}</div>`:detailTab==='route'?`<div class="card pad">${o.route.map((r,i)=>`<div class="operation"><div class="op-number">${i+1}</div><div class="op-info"><b>${esc(r)}</b><span>${i===j.op?'Aktif operasyon':i<j.op?'Tamamlanan operasyon':'Sıradaki operasyon'}</span></div>${i===j.op?'<span class="badge running">Aktif</span>':i<j.op?I('check',18):''}</div>`).join('')}</div>`:`<div class="card pad">${eventsMarkup(state.events.filter(e=>e.job===j.id))}</div>`}`}
function assignMachine(id,target){let j=job(id);if(target&&state.jobs.some(x=>x.id!==id&&x.machine===target&&!['complete','shipped'].includes(x.state))){toast('Makinede aktif bir iş var. Önce mevcut işi tamamlayın veya taşıyın.');render();return}j.machine=target;eventLog(j,'assign');save();render();toast('Makine ataması güncellendi')}
function productionPage(){let j=byMachine(machine),m=MACHINES.find(x=>x.id===machine)||MACHINES[0];return `<div class="operator"><div class="operator-top"><select class="op-machine-select" aria-label="Makine seçimi" onchange="machine=this.value;render()">${MACHINES.map(x=>`<option value="${x.id}" ${machine===x.id?'selected':''}>${x.id} · ${x.brand}</option>`).join('')}</select>${j?badge(j.state):badge('waiting')}</div>${j?operatorJob(j):`<div class="card pad empty">Bu makinede aktif iş yok.<br><br><button class="btn primary" onclick="go('jobs')">İş Emirlerine Git</button></div>`}</div>`}
function operatorJob(j){let o=jo(j);return `<div class="card op-job"><div class="op-summary"><div><div class="eyebrow">${esc(j.id)} · ${esc(o.customer)}</div><h2>${esc(o.part)}</h2><div class="tiny">${esc(o.route[j.op]||'İmalat')} · Rev. ${esc(o.revision)}</div></div><button class="btn sm" onclick="showDrawing('${esc(o.id)}')">${I('image',16)} Çizim</button></div><div class="qtybar"><b>${j.good} / ${o.qty}</b><strong>%${pct(j.good,o.qty)}</strong></div>${prog(j.good,o.qty)}<div class="three-metrics"><div><span class="tiny">Sağlam</span><strong>${j.good}</strong></div><div><span class="tiny">Hurda</span><strong style="color:var(--red)">${j.scrap}</strong></div><div><span class="tiny">Kalan</span><strong>${Math.max(0,o.qty-j.good)}</strong></div></div><div class="capture"><div class="row" style="margin-bottom:10px"><b>Üretim Kaydı</b><span class="tiny">${state.user} · ${j.machine}</span></div><div class="segmented"><button class="seg ${kind==='production'?'active good':''}" onclick="kind='production';render()">${I('check',16)} Sağlam</button><button class="seg ${kind==='scrap'?'active scrap':''}" onclick="kind='scrap';render()">${I('close',16)} Hurda</button></div><div class="stepper"><button aria-label="Azalt" onclick="changeQty(-1)">−</button><input id="operatorQty" class="input" type="number" inputmode="numeric" value="${qty}" min="1" aria-label="Adet" oninput="qty=Number(this.value)"><button aria-label="Artır" onclick="changeQty(1)">+</button></div><button class="btn primary full" ${j.state!=='running'?'disabled':''} onclick="recordQty('${j.id}')">${I('check',19)} ${kind==='scrap'?'Hurdayı':'Üretimi'} Kaydet</button></div><div class="op-actions">${j.state==='running'?`<button class="btn softamber" onclick="setStatus('${j.id}','paused')">${I('pause',18)} Duraklat</button>`:j.state==='paused'?`<button class="btn good" onclick="setStatus('${j.id}','running')">${I('play',18)} Devam Et</button>`:`<button class="btn good" onclick="setStatus('${j.id}','running')">${I('play',18)} İşe Başla</button>`}<button class="btn ghost" onclick="confirmFinish('${j.id}')">${I('check',18)} İşi Bitir</button></div><div class="op-links"><button onclick="openJob('${j.id}')">${I('file',15)} İş Detayı</button><button onclick="view='history';render()">${I('history',15)} Geçmiş</button></div></div>`}
function changeQty(delta){let inp=el('operatorQty');qty=Math.max(1,(Number(inp?.value)||1)+delta);if(inp)inp.value=qty}function eventLog(j,type,count=0){state.events.unshift({job:j.id,machine:j.machine||'—',user:state.user,type,qty:count,time:new Date().toISOString()})}function setStatus(id,s){let j=job(id);if(['complete','shipped'].includes(j.state))return;j.state=s;eventLog(j,s==='running'?'start':'pause');save();render();toast(s==='running'?'Üretim başladı / devam ediyor':'Üretim duraklatıldı')}function recordQty(id){let j=job(id),o=jo(j),n=Number(el('operatorQty')?.value);if(j.state!=='running')return toast('Önce işi başlatın');if(!Number.isInteger(n)||n<1)return toast('Geçerli bir adet girin');if(kind==='production'&&j.good+n>o.qty)return toast('Hedef miktarı geçemezsiniz');j[kind==='production'?'good':'scrap']+=n;eventLog(j,kind,n);qty=1;save();render();toast(n+' adet '+(kind==='production'?'sağlam üretim':'hurda')+' kaydedildi')}
function confirmFinish(id){let j=job(id);if(!j||!['running','paused'].includes(j.state))return toast('İş henüz başlatılmadı');modal='finish';chosenJob=id;renderModal()}function finishJob(){let j=job(chosenJob);j.state='complete';eventLog(j,'finish');save();closeModal();render();toast('İş emri tamamlandı · sevkiyata hazır')}
const eventNames={production:'Sağlam üretim',scrap:'Hurda kaydı',start:'İş başladı / devam',pause:'İş duraklatıldı',finish:'İş tamamlandı',assign:'Makine ataması',shipment:'Sevkiyat'};function eventsMarkup(items){return items.length?`<div class="timeline">${items.map(e=>`<div class="event ${e.type==='scrap'?'scrap':''}"><div class="dot">${I(e.type==='scrap'?'close':e.type==='pause'?'pause':'check',15)}</div><div class="detail"><b>${eventNames[e.type]||esc(e.type)}</b><span>${esc(e.user)} · ${esc(e.machine)} · ${esc(e.job)}</span></div><div style="text-align:right"><div class="amount">${e.qty?'+'+e.qty:'—'}</div><div class="when">${time(e.time)}</div></div></div>`).join('')}</div>`:'<div class="empty">Henüz işlem kaydı yok.</div>'}function historyPage(){return `<div class="section"><h2>İşlem Geçmişi</h2><span class="tiny">Kullanıcı · makine · zaman</span></div><div class="card pad">${eventsMarkup(state.events)}</div>`}
function shippingPage(){let ready=state.jobs.filter(j=>j.state==='complete'),shipped=state.shipments;return `<div class="section"><h2>Sevke Hazır (${ready.length})</h2></div><div class="list">${ready.map(j=>{let o=jo(j),sent=shipped.filter(s=>s.job===j.id).reduce((a,b)=>a+b.qty,0);return `<div class="list-card"><div class="row"><div><div class="list-id">${esc(j.id)}</div><div class="list-title">${esc(o.part)}</div><div class="list-sub">${esc(o.customer)} · ${esc(o.id)}</div></div><button class="btn primary sm" onclick="openShip('${esc(j.id)}')">${I('shipping',16)} Sevk Et</button></div><div class="list-bottom"><span>Üretilen ${j.good} adet</span><span>Sevk edilebilir <b>${j.good-sent}</b></span></div></div>`}).join('')||'<div class="card empty">Sevke hazır iş yok. Üretimi tamamladığınız işler burada görünür.</div>'}</div><div class="section"><h2>Sevkiyat Geçmişi</h2></div><div class="card pad">${shipped.length?shipped.map(s=>`<div class="event"><div class="dot">${I('shipping',16)}</div><div class="detail"><b>${esc(s.job)} · ${s.qty} adet</b><span>${esc(s.user)} · ${time(s.time)}</span></div></div>`).join(''):'<div class="empty">Henüz sevkiyat yok.</div>'}</div>`}
function openShip(id){chosenJob=id;modal='ship';renderModal()}function saveShipment(){let j=job(chosenJob),n=Number(el('shipQty')?.value),sent=state.shipments.filter(s=>s.job===j.id).reduce((v,s)=>v+s.qty,0);if(!Number.isInteger(n)||n<1||n>j.good-sent)return toast('Geçersiz sevk miktarı');state.shipments.unshift({job:j.id,qty:n,user:state.user,time:new Date().toISOString()});eventLog(j,'shipment',n);if(n+sent===j.good)j.state='shipped';save();closeModal();render();toast('Sevkiyat kaydedildi')}
function resetDemo(){if(!confirm('Demo verileri sıfırlansın mı? Bu tarayıcıdaki değişiklikler kaybolacak.'))return;state=structuredClone(initial);save();view='home';machine='CNC-01';qty=1;kind='production';render();toast('Demo başlangıç verileri yüklendi')}function startDemo(){machine='CNC-01';go('production');toast('Demo: Mazak üzerinde üretim ve hurda girişi yapın')}
function openWizard(){wizard={step:1,id:'SIP-'+String(Date.now()).slice(-5),customer:'',part:'',partNo:'',revision:'A',qty:1,due:'',created:new Date().toISOString().slice(0,10),material:'',dimensions:'',route:['İmalat'],machine:'',jobId:'WO-'+String(Date.now()).slice(-5),jobQty:1,drawing:'teknikResim.pdf'};modal='wizard';renderModal()}function captureWizard(){if(!wizard)return;document.querySelectorAll('[data-wiz]').forEach(e=>wizard[e.dataset.wiz]=e.type==='number'?Number(e.value):e.value)}function wizardNext(n){captureWizard();if(n>1&&wizard.step===1&&(!wizard.id.trim()||!wizard.customer.trim()||!wizard.part.trim()||!(wizard.qty>0)))return toast('Sipariş no, firma, parça ve adet zorunlu');if(n>2&&wizard.step===2&&!wizard.route.length)return toast('En az bir operasyon seçin');if(n===3&&!wizard.jobQty)wizard.jobQty=Number(wizard.qty)||1;wizard.step=n;renderModal()}function moveRoute(i,delta){let x=i+delta;if(x<0||x>=wizard.route.length)return;[wizard.route[i],wizard.route[x]]=[wizard.route[x],wizard.route[i]];renderModal()}function addRoute(){let v=el('newRoute')?.value;if(!v)return;if(wizard.route.includes(v))return toast('Bu operasyon zaten ekli');wizard.route.push(v);renderModal()}function removeRoute(i){wizard.route.splice(i,1);renderModal()}
function wizardContent(){let w=wizard;let steps=`<div class="step-progress">${[1,2,3].map(n=>`<span class="${n<=w.step?'on':''}"></span>`).join('')}</div>`;let data=(key,label,type='text')=>`<div class="formfield"><label>${label}</label><input class="input" data-wiz="${key}" type="${type}" value="${esc(w[key])}" ${key==='customer'?'autocomplete="off" aria-label="Müşteri ara"':key==='part'?'autocomplete="off" aria-label="Ürün ara"':''} ${type==='number'?'min="1"':''}></div>`;let body=w.step===1?`<div class="formgrid">${data('id','Sipariş Numarası')}${data('customer','Müşteri / Firma · 3 karakterle ara')}${data('part','Parça Adı · 3 karakterle ara')}${data('partNo','Parça Numarası')}${data('qty','Sipariş Adedi','number')}${data('due','Teslim Tarihi','date')}${data('revision','Revizyon')}${data('created','Sipariş Tarihi','date')}${data('material','Malzeme')}${data('dimensions','Malzeme Ölçüleri')}</div><div class="tiny" style="margin-top:12px">Teknik resim sipariş oluşturulduktan sonra sipariş detayından yüklenebilir.</div>`:w.step===2?`<p class="muted" style="margin-top:0">Operasyonları <b>siparişe</b> ait olarak belirleyin. Sıralama iş emirlerinde aynı kalır.</p>${w.route.map((op,i)=>`<div class="route-row"><span class="op-number">${i+1}</span><b>${esc(op)}</b><button class="btn sm" onclick="moveRoute(${i},-1)" aria-label="Yukarı taşı">↑</button><button class="btn sm" onclick="moveRoute(${i},1)" aria-label="Aşağı taşı">↓</button><button class="btn sm softred" onclick="removeRoute(${i})" aria-label="Sil">×</button></div>`).join('')}<div class="row"><select class="select" id="newRoute">${OPS.filter(x=>!w.route.includes(x)).map(x=>`<option>${x}</option>`).join('')}</select><button class="btn" onclick="addRoute()">${I('plus',16)} Ekle</button></div>`:`<div class="formgrid">${data('jobId','İlk İş Emri Numarası')}${data('jobQty','İlk İş Emri Planlanan Miktarı','number')}<div class="formfield"><label>Makine Ataması</label><select class="select" data-wiz="machine"><option value="">Sonra ata</option>${MACHINES.map(m=>`<option value="${m.id}" ${w.machine===m.id?'selected':''}>${m.id} · ${m.brand}</option>`).join('')}</select></div></div><div class="card pad" style="margin-top:14px;box-shadow:none;background:#f7f9fd"><div class="eyebrow">SİPARİŞ ÖZETİ</div><h3 style="margin:6px 0">${esc(w.part)} · ${esc(w.qty)} adet</h3><div class="tiny">${esc(w.customer)} · ${esc(w.id)}</div><div class="flowline" style="margin-top:10px">${w.route.map(r=>`<span class="flowtag">${esc(r)}</span>`).join(I('arrow',13))}</div></div>`;return steps+body}
function createOrder(){captureWizard();let w=wizard;if(!w.id.trim()||!w.jobId.trim())return toast('Sipariş ve iş emri numarası gerekli');if(!Number.isInteger(Number(w.jobQty))||Number(w.jobQty)<1||Number(w.jobQty)>Number(w.qty))return toast('İş emri miktarı 1 ile sipariş miktarı arasında olmalı');if(state.orders.some(o=>o.id===w.id)||state.jobs.some(j=>j.id===w.jobId))return toast('Sipariş ya da iş emri numarası zaten mevcut');if(w.machine&&byMachine(w.machine))return toast('Bu makinede hâlihazırda iş var');let {step,machine,jobId,jobQty,...o}=w;state.orders.unshift(o);state.jobs.unshift({id:jobId,order:o.id,machine,plannedQty:Number(jobQty),state:'waiting',good:0,scrap:0,op:0});save();closeModal();openOrder(o.id);toast('Sipariş ve ilk iş emri oluşturuldu')}
function openNewJobWizard(){let opts=state.orders.map(o=>`<option value="${esc(o.id)}">${esc(o.id)} · ${esc(o.customer)} · ${esc(o.part)}</option>`).join('');modal='newJobPicker';el('overlay').innerHTML=`<div class="modal-backdrop" onclick="if(event.target===this)closeModal()"><div class="modal"><div class="modal-head"><h2>Yeni İş Emri Oluştur</h2><button class="btn sm" onclick="closeModal()">Kapat</button></div><p class="muted">Mevcut siparişi seçin. Operasyon sırası ve teknik resim siparişten alınır.</p><div class="formfield"><label>Bağlı Sipariş</label><select id="pickOrder" class="select" style="width:100%">${opts}</select></div><div class="modal-foot"><button class="btn primary" onclick="let v=el('pickOrder').value;closeModal();newJobFor(v)">Devam Et →</button></div></div></div>`} 
function newJobFor(orderId){chosenJob=orderId;modal='newJob';renderModal()}function createAdditionalJob(){let id=el('additionalJobId').value.trim(),ma=el('additionalMachine').value;if(!id||state.jobs.some(j=>j.id===id))return toast('İş emri numarası geçersiz veya mevcut');if(ma&&byMachine(ma))return toast('Bu makinede aktif iş var');state.jobs.push({id,order:chosenJob,machine:ma,state:'waiting',good:0,scrap:0,op:0});save();closeModal();openJob(id);toast('Yeni iş emri oluşturuldu')}
function showDrawing(id){chosenJob=id;zoom=1;modal='drawing';renderModal()}function changeZoom(d){zoom=Math.min(3,Math.max(.5,zoom+d));let im=el('techZoom');if(im)im.style.transform=`scale(${zoom})`}function uploadDrawing(e,id){let f=e.target.files?.[0];if(!f)return;if(f.size>1900000)return toast('Demo için 1.9 MB altı dosya kullanın');let rd=new FileReader;rd.onload=()=>{order(id).drawing=rd.result;save();render();toast('Teknik resim eklendi')};rd.readAsDataURL(f)}function closeModal(){modal='';el('overlay').innerHTML=''}
function renderModal(){let j=job(chosenJob),o=j?jo(j):order(chosenJob),heading='',content='',foot='',klass='';if(modal==='wizard'){heading=['','1 / 3 · Sipariş Bilgileri','2 / 3 · Operasyon Rotası','3 / 3 · İş Emri Oluştur'][wizard.step];content=wizardContent();foot=`<button class="btn" onclick="${wizard.step===1?'closeModal()':`wizardNext(${wizard.step-1})`}">${wizard.step===1?'Vazgeç':'← Geri'}</button><button class="btn primary" onclick="${wizard.step===3?'createOrder()':`wizardNext(${wizard.step+1})`}">${wizard.step===3?'Siparişi Oluştur':'Devam Et →'}</button>`}else if(modal==='drawing'){klass='tech-modal';heading='Teknik Resim · '+esc(o.id);content=`<div class="tech-stage">${(o.drawing||'teknikResim.pdf')?((o.drawing||'teknikResim.pdf').toLowerCase().endsWith('.pdf')||(o.drawing||'').startsWith('data:application/pdf')?`<iframe title="Teknik resim PDF" src="${o.drawing||'teknikResim.pdf'}"></iframe>`:`<img id="techZoom" src="${o.drawing}" alt="Teknik resim">`):`<div style="text-align:center;color:#687da0">${I('image',68)}<h2>Teknik çizim önizlemesi</h2><p>Bu siparişe henüz dosya yüklenmedi.</p><p style="font-size:12px">Sipariş detayından PDF, PNG veya JPG ekleyebilirsiniz.</p></div>`}</div><p class="tiny">Teknik resim siparişe bağlıdır ve o siparişin iş emirlerinde kullanılabilir.</p>`;foot=`${o.drawing&&!o.drawing.endsWith('.pdf')&&!o.drawing.startsWith('data:application/pdf')?`<div class="row"><button class="btn" onclick="changeZoom(-.25)">−</button><button class="btn" onclick="changeZoom(.25)">+</button></div>`:'<span></span>'}<button class="btn primary" onclick="closeModal()">Kapat</button>`}else if(modal==='finish'){heading='İş Emrini Tamamla';content=`<p><b>${esc(j.id)}</b> · ${esc(jo(j).part)}</p><p>Sağlam: <b>${j.good}</b> / ${jo(j).qty} · Hurda: <b>${j.scrap}</b></p><p class="muted">Tamamlandığında sevkiyat listesine aktarılır. Operatör onayı hesabınızla kaydedilir.</p>`;foot=`<button class="btn" onclick="closeModal()">Vazgeç</button><button class="btn good" onclick="finishJob()">${I('check',16)} Onayla ve Bitir</button>`}else if(modal==='ship'){heading='Sevkiyat Oluştur';let sent=state.shipments.filter(s=>s.job===j.id).reduce((a,b)=>a+b.qty,0);content=`<p>${esc(j.id)} · ${esc(jo(j).part)}</p><div class="formfield"><label>Sevk Edilecek Adet · En fazla ${j.good-sent}</label><input class="input" id="shipQty" type="number" inputmode="numeric" min="1" max="${j.good-sent}" value="${j.good-sent}"></div>`;foot=`<button class="btn" onclick="closeModal()">İptal</button><button class="btn primary" onclick="saveShipment()">Sevkiyatı Kaydet</button>`}else if(modal==='newJob'){heading='Siparişe Bağlı İş Emri';content=`<p class="muted">${esc(chosenJob)} siparişinin operasyon rotası yeni iş emrinde de kullanılacak.</p><div class="formgrid"><div class="formfield"><label>İş Emri No</label><input class="input" id="additionalJobId" value="WO-${String(Date.now()).slice(-5)}"></div><div class="formfield"><label>Makine</label><select class="select" id="additionalMachine"><option value="">Sonra ata</option>${MACHINES.map(m=>`<option value="${m.id}">${m.id} · ${m.brand}</option>`).join('')}</select></div></div>`;foot=`<button class="btn" onclick="closeModal()">Vazgeç</button><button class="btn primary" onclick="createAdditionalJob()">İş Emri Oluştur</button>`}el('overlay').innerHTML=`<div class="modal-back" onclick="if(event.target===this)closeModal()"><div class="modal ${klass}" role="dialog" aria-modal="true"><div class="modal-head"><h2>${heading}</h2><button class="btn sm" aria-label="Kapat" onclick="closeModal()">${I('close',17)}</button></div><div class="modal-body">${content}</div><div class="modal-foot">${foot}</div></div></div>`}
function exportCSV(){let rows=[['İş Emri','Sipariş','Firma','Parça','Makine','Durum','Hedef','Sağlam','Hurda'],...state.jobs.map(j=>{let o=jo(j);return[j.id,o.id,o.customer,o.part,j.machine,names[j.state],o.qty,j.good,j.scrap]})];let txt='\ufeff'+rows.map(r=>r.map(x=>'"'+String(x??'').replace(/"/g,'""')+'"').join(';')).join('\r\n');let a=document.createElement('a');a.href=URL.createObjectURL(new Blob([txt],{type:'text/csv;charset=utf-8'}));a.download='ritim-flow-rapor.csv';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),500)};
window.ritimUXBridge={getState:()=>state,order,job,shipmentSummary};render();</script><script defer src="assets/js/ux-shell.js?v=1"></script><link rel="stylesheet" href="assets/css/ux-orders-workorders.css?v=3"><script defer src="assets/js/ux-orders-workorders.js?v=3"></script><script src="assets/js/ux-operator.js?v=5"></script><script src="assets/js/ux-logistics.js?v=6"></script><script src="assets/js/ux-audit.js?v=7"></script></body></html>
