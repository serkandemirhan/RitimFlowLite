# Simple workflow for deploying static content to GitHub Pages
name: Deploy static content to Pages

on:
  # Runs on pushes targeting the default branch
  push:
    branches: ["main"]

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

# Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Allow only one concurrent deployment, skipping runs queued between the run in-progress and latest queued.
# However, do NOT cancel in-progress runs as we want to allow these production deployments to complete.
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  # Existing live release is untouched until an explicitly authorized push/run.
  verify:
    uses: ./.github/workflows/rc1-ci.yml
    permissions:
      contents: read

  deploy:
    # RC1 review only: release gates, including legacy writer isolation and mobile acceptance, remain open.
    if: ${{ false }}
    needs: verify
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Download only the verified public candidate
        uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5
        with:
          name: rc1-public
          path: artifacts/pages-public
      - name: Setup Pages
        uses: actions/configure-pages@v5
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          # Tests, evidence, source tooling and backups are excluded.
          path: artifacts/pages-public
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
