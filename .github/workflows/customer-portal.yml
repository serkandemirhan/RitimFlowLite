name: Customer portal verification
on:
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  portal:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: portal_ci_only
          POSTGRES_DB: portal_test
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready --health-interval 5s
          --health-timeout 5s --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql://postgres:portal_ci_only@127.0.0.1:5432/portal_test
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci && npm ci --prefix backend
      - run: npx playwright install --with-deps chromium
      - run: npm run test:portal --prefix backend
      - run: npm run test:unit --prefix backend
      - run: npm run test:portal:ui
      - run: node scripts/build-cloud.cjs
