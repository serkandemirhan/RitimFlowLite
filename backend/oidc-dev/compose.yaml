services:
  identity-db:
    image: postgres:16.10
    environment:
      POSTGRES_DB: keycloak
      POSTGRES_USER: keycloak
      POSTGRES_PASSWORD: ${KEYCLOAK_DB_PASSWORD:?Set a fictional database password}
    volumes:
      - identity-db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U keycloak -d keycloak"]
      interval: 3s
      timeout: 3s
      retries: 30
  keycloak:
    image: quay.io/keycloak/keycloak:26.4.7@sha256:9409c59bdfb65dbffa20b11e6f18b8abb9281d480c7ca402f51ed3d5977e6007
    command: ["start-dev", "--import-realm"]
    environment:
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://identity-db:5432/keycloak
      KC_DB_USERNAME: keycloak
      KC_DB_PASSWORD: ${KEYCLOAK_DB_PASSWORD:?Set a fictional database password}
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KEYCLOAK_ADMIN_USERNAME:?Set a fictional admin username}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:?Set a fictional admin password}
      KC_HOSTNAME: ${KEYCLOAK_ISSUER_ORIGIN:-https://localhost:44739}
      KC_HTTPS_PORT: ${KEYCLOAK_CONTAINER_PORT:-8443}
      KC_HTTPS_CERTIFICATE_FILE: /fixture/tls.crt
      KC_HTTPS_CERTIFICATE_KEY_FILE: /fixture/tls.key
      KC_HTTP_ENABLED: 'false'
    volumes:
      - ${OIDC_FIXTURE_DIR:?Generate a private fixture directory}/realm.json:/opt/keycloak/data/import/realm.json:ro
      - ${OIDC_FIXTURE_DIR:?Generate a private fixture directory}/tls.crt:/fixture/tls.crt:ro
      - ${OIDC_FIXTURE_DIR:?Generate a private fixture directory}/tls.key:/fixture/tls.key:ro
    ports:
      - '127.0.0.1:${KEYCLOAK_PORT:-44739}:${KEYCLOAK_CONTAINER_PORT:-8443}'
    networks:
      default:
        aliases:
          - ${KEYCLOAK_DNS_ALIAS:-keycloak}
    depends_on:
      identity-db:
        condition: service_healthy
volumes:
  identity-db:
