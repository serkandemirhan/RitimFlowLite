services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-ritim}
      POSTGRES_USER: ${POSTGRES_USER:-ritim}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in an untracked environment file}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 5s
      timeout: 3s
      retries: 20
  migrate:
    build: .
    command: ["node", "src/migrate.js"]
    environment: &database_env
      PGHOST: db
      PGPORT: 5432
      PGDATABASE: ${POSTGRES_DB:-ritim}
      PGUSER: ${POSTGRES_USER:-ritim}
      PGPASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in an untracked environment file}
      DB_SSL: disable
    depends_on:
      db:
        condition: service_healthy
    restart: "no"
  api:
    build: .
    environment:
      <<: *database_env
      HOST: 0.0.0.0
      PORT: 3000
      OIDC_ISSUER: ${OIDC_ISSUER:-}
      OIDC_AUDIENCE: ${OIDC_AUDIENCE:-}
      OIDC_JWKS_URL: ${OIDC_JWKS_URL:-}
    ports:
      - "127.0.0.1:${API_PORT:-3000}:3000"
    depends_on:
      migrate:
        condition: service_completed_successfully
    restart: unless-stopped
volumes:
  postgres_data:
